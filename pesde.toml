name = "luau_ecs/signalis"
version = "0.1.0-dontuse"
description = "signalis is a robust, fast, fully-featured signal library for luau."
authors = ["nnullcolumn"]
repository = "https://github.com/luau-ecs/signalis"
license = "MIT"
includes = [
	"src",
	"readme.md",
	"changelog.md",
	"license",
	"pesde.toml",
	"release.project.json",
]

[target]
environment = "luau"
lib = "src/init.luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[scripts]
roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"

[dev_dependencies]
scripts = { name = "pesde/scripts_rojo", version = "^0.1.0", target = "lune" }
rojo = { name = "pesde/rojo", version = "^7.4.4", target = "lune" }
